<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapizList PRO | Task Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <h1>🐚 CapizList <span class="badge">PRO</span></h1>
        <div class="user-profile">Isaac Canales</div>
    </header>

    <main class="app-container">
        <!-- Panel 1: Captura Rápida -->
        <aside class="panel capture-panel">
            <h2>Quick Capture</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Título</label>
                    <input type="text" id="task-title" placeholder="Añadir una nueva tarea..." required>
                </div>
                <div class="form-group">
                    <label for="task-category">Categoría</label>
                    <select id="task-category">
                        <option value="Trabajo">Trabajo</option>
                        <option value="Gym">Gym</option>
                        <option value="Universidad">Universidad</option>
                        <option value="Casa">Casa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-priority">Prioridad</label>
                    <select id="task-priority">
                        <option value="Alta">Alta</option>
                        <option value="Media" selected>Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-date">Fecha Límite</label>
                    <input type="date" id="task-date" required>
                </div>
                <button type="submit" class="btn-primary">+ Crear Tarea</button>
            </form>
            <div class="api-sync-box">
                <button id="btn-fetch-api" class="btn-secondary">📥 Sincronizar API Externa</button>
            </div>
        </aside>

        <!-- Panel 2: Centro de Mando Diario -->
        <section class="panel daily-panel">
            <div class="panel-header">
                <h2>Today's Tasks</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Todas</button>
                    <button class="filter-btn" data-filter="pending">Pendientes</button>
                    <button class="filter-btn" data-filter="completed">Completadas</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Buscar tarea...">
            </div>
            <div id="tasks-container" class="tasks-list">
                <!-- Las tareas se renderizan dinámicamente aquí via DOM -->
            </div>
        </section>

        <!-- Panel 3: Radar de Urgencia -->
        <aside class="panel urgency-panel">
            <h2>Urgency Radar</h2>
            <div id="urgency-radar-content" class="radar-content">
                <!-- Alertas dinámicas según dueDate -->
            </div>
        </aside>
    </main>

    <!-- Script Principal con módulo ES6 -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
